<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>后羿射日</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #05060f;
    display: flex;
    flex-direction: column;
    align-items: center;
    font-family: "Microsoft JhengHei", "PingFang TC", sans-serif;
    color: #fff;
    padding: 16px;
  }
  h1 { margin: 8px 0; letter-spacing: 2px; }
  #gameWrap {
    position: relative;
    width: 100%;
    max-width: 900px;
  }
  canvas {
    width: 100%;
    height: auto;
    background: linear-gradient(#1b2450, #0b1023);
    border: 2px solid #333;
    border-radius: 10px;
    display: block;
  }
  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    background: rgba(0, 0, 0, 0.6);
    border-radius: 10px;
    padding: 20px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 4px 0; font-size: 28px; }
  #overlay p { opacity: 0.85; line-height: 1.6; }
  button {
    margin-top: 16px;
    padding: 10px 26px;
    font-size: 17px;
    border: none;
    border-radius: 8px;
    background: #ffb84d;
    cursor: pointer;
    font-weight: bold;
  }
  button:hover { background: #ffa726; }
  #hint { font-size: 13px; opacity: 0.6; margin-top: 10px; }
</style>
</head>
<body>
  <h1>🏹 后羿射日</h1>
  <div id="gameWrap">
    <canvas id="game" width="900" height="600"></canvas>
    <div id="overlay">
      <h2>后羿射日</h2>
      <p>
        ← → 或 A / D 移動閃避彈幕<br />
        按住空白鍵射箭,會自動鎖定最近的太陽<br />
        接住掉落的 🐇 可以獲得隨機 Buff
      </p>
      <button id="startBtn">開始遊戲</button>
    </div>
  </div>
  <p id="hint">九個太陽,只要留下最後一個就好——這就是中秋節月亮的由來。</p>

<script>
/* ========================================================
   后羿射日 — 單檔 Canvas 小遊戲
   結構說明(方便你之後跟同學/老師解釋核心功能):
   1. 用一個簡單的「狀態機」控制流程: start → playing → win / lose
   2. 每一種畫面物件(太陽、玩家、箭矢、彈幕、兔子、特效)
      都用陣列儲存,每一幀 update() 更新座標與邏輯、
      draw() 負責畫出目前狀態,兩者分開讓邏輯更好追蹤跟測試。
   3. 碰撞判定全部用「兩點距離 < 兩者半徑和」這個最簡單的圓形碰撞算法。
   ======================================================== */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
const overlay = document.getElementById('overlay');
const startBtn = document.getElementById('startBtn');

// ---- 輸入 ----
const keys = {};
window.addEventListener('keydown', (e) => {
  keys[e.key] = true;
  if (e.key === ' ') e.preventDefault(); // 避免空白鍵捲動頁面
});
window.addEventListener('keyup', (e) => { keys[e.key] = false; });

// ---- 遊戲狀態 ----
let state = 'start'; // 'start' | 'playing' | 'win' | 'lose'
let lastTime = 0;
let shake = 0; // 畫面震動強度,受傷時會觸發

let player, suns, projectiles, arrows, rabbits, particles, floatingTexts;
let rabbitTimer = 5;
let victoryAnim = { moonY: H + 60, starAlpha: 0, textAlpha: 0, timer: 0 };

function initGame() {
  player = {
    x: W / 2, y: H - 70,
    speed: 260,
    hp: 100, maxHp: 100,
    attackCooldown: 0, attackInterval: 0.45,
    invincible: 0,
    buff: null, buffTimer: 0,
  };

  suns = [];
  const count = 9;
  const margin = 70;
  const spacing = (W - margin * 2) / (count - 1);
  for (let i = 0; i < count; i++) {
    suns.push({
      x: margin + spacing * i,
      y: 100,
      r: 27,
      hp: 30, maxHp: 30,
      alive: true,
      fireTimer: Math.random() * 1.5,
      fireInterval: 1.1 + Math.random() * 0.9,
      bob: Math.random() * Math.PI * 2,
      hitFlash: 0,
    });
  }

  projectiles = [];
  arrows = [];
  rabbits = [];
  particles = [];
  floatingTexts = [];
  rabbitTimer = 4 + Math.random() * 3;
}

// ---- 輔助函式 ----
function aliveSuns() { return suns.filter((s) => s.alive); }

function nearestSun() {
  const alive = aliveSuns();
  if (alive.length === 0) return null;
  let best = alive[0], bestDist = Infinity;
  for (const s of alive) {
    const d = Math.hypot(s.x - player.x, s.y - player.y);
    if (d < bestDist) { bestDist = d; best = s; }
  }
  return best;
}

function spawnProjectile(sun) {
  const doSpread = Math.random() < 0.2; // 兩成機率發射扇形彈幕
  const baseSpeed = 170 + Math.random() * 70;
  if (doSpread) {
    for (const ang of [-0.35, 0, 0.35]) {
      projectiles.push({
        x: sun.x, y: sun.y + sun.r,
        vx: Math.sin(ang) * baseSpeed,
        vy: Math.cos(ang) * baseSpeed,
        r: 7,
      });
    }
  } else {
    projectiles.push({
      x: sun.x, y: sun.y + sun.r,
      vx: (Math.random() - 0.5) * 30,
      vy: baseSpeed,
      r: 7,
    });
  }
}

function fireArrow() {
  const target = nearestSun();
  if (!target) return;
  const speed = 480;
  const shootAt = (t) => {
    const dx = t.x - player.x, dy = t.y - (player.y - 10);
    const dist = Math.hypot(dx, dy) || 1;
    arrows.push({ x: player.x, y: player.y - 10, vx: (dx / dist) * speed, vy: (dy / dist) * speed, target: t });
  };
  shootAt(target);
  if (player.buff === 'double') {
    const rest = aliveSuns().filter((s) => s !== target);
    if (rest.length) {
      let second = rest[0], bd = Infinity;
      for (const s of rest) {
        const d = Math.hypot(s.x - player.x, s.y - player.y);
        if (d < bd) { bd = d; second = s; }
      }
      shootAt(second);
    }
  }
}

function spawnRabbit() {
  rabbits.push({ x: 40 + Math.random() * (W - 80), y: -20, r: 16, vy: 70 + Math.random() * 30 });
}

function addFloatingText(x, y, text, color) {
  floatingTexts.push({ x, y, text, color, life: 1.2, vy: -40 });
}

function spawnParticles(x, y, color, count = 18) {
  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const spd = 60 + Math.random() * 140;
    particles.push({ x, y, vx: Math.cos(ang) * spd, vy: Math.sin(ang) * spd, life: 0.6 + Math.random() * 0.4, color });
  }
}

function applyBuff(type) {
  if (type === 'heal') {
    player.hp = Math.min(player.maxHp, player.hp + 25);
    addFloatingText(player.x, player.y - 30, '+25 HP', '#7CFC00');
    return;
  }
  player.buff = type;
  player.buffTimer = 6;
  const names = { rapid: '連射!', double: '雙箭!', shield: '無敵!' };
  addFloatingText(player.x, player.y - 30, names[type] || 'Buff!', '#ffd54f');
}

function checkWin() {
  if (aliveSuns().length === 1 && state === 'playing') {
    state = 'win';
    victoryAnim = { moonY: H + 60, starAlpha: 0, textAlpha: 0, timer: 0 };
    setTimeout(() => showOverlay('win'), 4200); // 先讓玩家看完動畫再跳出結算畫面
  }
}

// ---- 更新邏輯 ----
function update(dt) {
  shake = Math.max(0, shake - dt * 40);

  if (state !== 'playing') {
    if (state === 'win') updateVictory(dt);
    return;
  }

  if (keys['ArrowLeft'] || keys['a'] || keys['A']) player.x -= player.speed * dt;
  if (keys['ArrowRight'] || keys['d'] || keys['D']) player.x += player.speed * dt;
  player.x = Math.max(30, Math.min(W - 30, player.x));

  player.attackCooldown -= dt;
  const interval = player.buff === 'rapid' ? player.attackInterval / 2.2 : player.attackInterval;
  if (keys[' '] && player.attackCooldown <= 0 && aliveSuns().length > 0) {
    fireArrow();
    player.attackCooldown = interval;
  }

  if (player.invincible > 0) player.invincible -= dt;
  if (player.buffTimer > 0) {
    player.buffTimer -= dt;
    if (player.buffTimer <= 0) player.buff = null;
  }

  for (const s of suns) {
    if (!s.alive) continue;
    s.bob += dt * 2;
    s.hitFlash = Math.max(0, s.hitFlash - dt * 4);
    s.fireTimer -= dt;
    if (s.fireTimer <= 0) {
      spawnProjectile(s);
      s.fireTimer = s.fireInterval;
    }
  }

  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.x += p.vx * dt; p.y += p.vy * dt;
    if (p.y > H + 20 || p.x < -20 || p.x > W + 20) { projectiles.splice(i, 1); continue; }
    const dist = Math.hypot(p.x - player.x, p.y - (player.y - 10));
    if (dist < p.r + 16) {
      projectiles.splice(i, 1);
      if (player.invincible <= 0 && player.buff !== 'shield') {
        player.hp -= 8;
        player.invincible = 0.6;
        shake = 8;
        spawnParticles(player.x, player.y, '#ff7043', 10);
        if (player.hp <= 0) {
          player.hp = 0;
          state = 'lose';
          showOverlay('lose');
        }
      }
    }
  }

  for (let i = arrows.length - 1; i >= 0; i--) {
    const a = arrows[i];
    a.x += a.vx * dt; a.y += a.vy * dt;
    if (a.y < -20 || a.x < -20 || a.x > W + 20) { arrows.splice(i, 1); continue; }
    if (a.target && a.target.alive) {
      const dist = Math.hypot(a.x - a.target.x, a.y - a.target.y);
      if (dist < a.target.r + 6) {
        a.target.hp -= 6;
        a.target.hitFlash = 1;
        spawnParticles(a.x, a.y, '#fff59d', 6);
        arrows.splice(i, 1);
        if (a.target.hp <= 0) {
          a.target.alive = false;
          spawnParticles(a.target.x, a.target.y, '#ffb300', 30);
          addFloatingText(a.target.x, a.target.y, '擊落!', '#ffca28');
          checkWin();
        }
        continue;
      }
    } else {
      arrows.splice(i, 1);
    }
  }

  rabbitTimer -= dt;
  if (rabbitTimer <= 0) { spawnRabbit(); rabbitTimer = 6 + Math.random() * 4; }
  for (let i = rabbits.length - 1; i >= 0; i--) {
    const r = rabbits[i];
    r.y += r.vy * dt;
    if (r.y > H + 20) { rabbits.splice(i, 1); continue; }
    const dist = Math.hypot(r.x - player.x, r.y - player.y);
    if (dist < r.r + 18) {
      rabbits.splice(i, 1);
      const types = ['rapid', 'double', 'shield', 'heal'];
      applyBuff(types[Math.floor(Math.random() * types.length)]);
    }
  }

  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
    if (p.life <= 0) particles.splice(i, 1);
  }

  for (let i = floatingTexts.length - 1; i >= 0; i--) {
    const t = floatingTexts[i];
    t.y += t.vy * dt; t.life -= dt;
    if (t.life <= 0) floatingTexts.splice(i, 1);
  }
}

function updateVictory(dt) {
  victoryAnim.timer += dt;
  victoryAnim.moonY = Math.max(110, H + 60 - victoryAnim.timer * 80);
  victoryAnim.starAlpha = Math.min(1, victoryAnim.timer / 2);
  victoryAnim.textAlpha = Math.min(1, (victoryAnim.timer - 1) / 1.5);
}

// ---- 繪製 ----
function draw() {
  ctx.save();
  if (shake > 0) {
    ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
  }

  drawBackground();

  if (state === 'playing' || state === 'win' || state === 'lose') {
    drawSuns();
    drawProjectiles();
    drawArrows();
    drawRabbits();
    drawPlayer();
    drawParticles();
    drawFloatingTexts();
    drawHUD();
  }

  if (state === 'win') drawVictory();

  ctx.restore();
}

function drawBackground() {
  ctx.fillStyle = '#0b1023';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  for (let i = 0; i < 40; i++) {
    const x = (i * 97) % W, y = (i * 53) % H;
    ctx.fillRect(x, y, 2, 2);
  }
}

function drawSuns() {
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const s of suns) {
    if (!s.alive) continue;
    const bobY = s.y + Math.sin(s.bob) * 4;
    ctx.save();
    if (s.hitFlash > 0) { ctx.shadowColor = '#fff'; ctx.shadowBlur = 20 * s.hitFlash; }
    ctx.font = `${s.r * 2}px serif`;
    ctx.fillText('☀️', s.x, bobY);
    ctx.restore();

    const barW = 50;
    ctx.fillStyle = '#333';
    ctx.fillRect(s.x - barW / 2, s.y - s.r - 16, barW, 6);
    ctx.fillStyle = s.hp / s.maxHp > 0.4 ? '#66bb6a' : '#ef5350';
    ctx.fillRect(s.x - barW / 2, s.y - s.r - 16, barW * (s.hp / s.maxHp), 6);
  }
}

function drawProjectiles() {
  ctx.fillStyle = '#ffab40';
  for (const p of projectiles) {
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fill();
  }
}

function drawArrows() {
  ctx.strokeStyle = '#fff59d';
  ctx.lineWidth = 3;
  for (const a of arrows) {
    const len = 14;
    const ang = Math.atan2(a.vy, a.vx);
    ctx.beginPath();
    ctx.moveTo(a.x - Math.cos(ang) * len, a.y - Math.sin(ang) * len);
    ctx.lineTo(a.x, a.y);
    ctx.stroke();
  }
}

function drawRabbits() {
  ctx.font = '32px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (const r of rabbits) ctx.fillText('🐇', r.x, r.y);
}

function drawPlayer() {
  ctx.save();
  if (player.invincible > 0 && Math.floor(player.invincible * 20) % 2 === 0) ctx.globalAlpha = 0.4;
  if (player.buff === 'shield') {
    ctx.strokeStyle = '#4fc3f7';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.arc(player.x, player.y - 10, 32, 0, Math.PI * 2);
    ctx.stroke();
  }
  ctx.font = '36px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🏹', player.x, player.y);
  ctx.restore();
  ctx.fillStyle = '#fff';
  ctx.font = '13px sans-serif';
  ctx.fillText('后羿', player.x, player.y + 26);
}

function drawParticles() {
  for (const p of particles) {
    ctx.globalAlpha = Math.max(0, p.life);
    ctx.fillStyle = p.color;
    ctx.fillRect(p.x - 2, p.y - 2, 4, 4);
  }
  ctx.globalAlpha = 1;
}

function drawFloatingTexts() {
  ctx.textAlign = 'center';
  for (const t of floatingTexts) {
    ctx.globalAlpha = Math.max(0, t.life);
    ctx.fillStyle = t.color;
    ctx.font = 'bold 18px sans-serif';
    ctx.fillText(t.text, t.x, t.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD() {
  ctx.textAlign = 'left';
  ctx.fillStyle = '#333';
  ctx.fillRect(20, 20, 200, 18);
  ctx.fillStyle = player.hp / player.maxHp > 0.3 ? '#66bb6a' : '#ef5350';
  ctx.fillRect(20, 20, 200 * (player.hp / player.maxHp), 18);
  ctx.strokeStyle = '#fff';
  ctx.strokeRect(20, 20, 200, 18);
  ctx.fillStyle = '#fff';
  ctx.font = '13px sans-serif';
  ctx.fillText(`HP ${Math.ceil(player.hp)}/${player.maxHp}`, 26, 34);

  ctx.textAlign = 'right';
  ctx.fillText(`存活太陽: ${aliveSuns().length}`, W - 20, 34);
  if (player.buff) {
    const names = { rapid: '連射中', double: '雙箭中', shield: '無敵中' };
    ctx.fillStyle = '#ffd54f';
    ctx.fillText(`${names[player.buff]} ${player.buffTimer.toFixed(1)}s`, W - 20, 54);
  }
}

function drawVictory() {
  ctx.fillStyle = 'rgba(5,8,30,0.55)';
  ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = `rgba(255,255,255,${victoryAnim.starAlpha})`;
  for (let i = 0; i < 60; i++) {
    const x = (i * 67) % W, y = (i * 31) % H;
    ctx.fillRect(x, y, 2, 2);
  }
  ctx.font = '80px serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🌕', W / 2, victoryAnim.moonY);

  ctx.globalAlpha = victoryAnim.textAlpha;
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 26px sans-serif';
  ctx.fillText('留下了最後一顆太陽', W / 2, H / 2 + 150);
  ctx.font = '16px sans-serif';
  ctx.fillText('這一顆,就是我們現在每年中秋看到的月亮', W / 2, H / 2 + 182);
  ctx.globalAlpha = 1;
}

// ---- 畫面切換 ----
function showOverlay(kind) {
  overlay.classList.remove('hidden');
  if (kind === 'win') {
    overlay.innerHTML = `<h2>🎉 通關!</h2><p>后羿成功留下了最後一顆太陽。</p><button id="restartBtn">再玩一次</button>`;
  } else if (kind === 'lose') {
    overlay.innerHTML = `<h2>💥 遊戲結束</h2><p>后羿被彈幕擊倒了……</p><button id="restartBtn">再試一次</button>`;
  }
  document.getElementById('restartBtn').addEventListener('click', () => {
    overlay.classList.add('hidden');
    initGame();
    state = 'playing';
  });
}

startBtn.addEventListener('click', () => {
  overlay.classList.add('hidden');
  initGame();
  state = 'playing';
});

// ---- 主迴圈 ----
function loop(ts) {
  if (!lastTime) lastTime = ts;
  const dt = Math.min(0.033, (ts - lastTime) / 1000);
  lastTime = ts;
  update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
</html>
